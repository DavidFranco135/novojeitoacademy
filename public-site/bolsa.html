<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Novo Jeito Academy</title>
<meta name="theme-color" content="#050505"/>
<meta name="robots" content="noindex"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050505;color:#F5F0E8;font-family:'Inter',sans-serif;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  :root{--gold:#C58A4A;--gold2:#E8B97A;--gray:#9d9384}
  .wrap{max-width:480px;text-align:center}
  .eyebrow{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(1.6rem,5vw,2.1rem);margin:.8rem 0 1rem;line-height:1.2}
  h1 em{color:var(--gold);font-style:italic}
  p{color:var(--gray);font-size:.95rem;line-height:1.7;margin-bottom:2rem}
  .btn-primary{display:inline-block;background:var(--gold);color:#050505;border:none;padding:.9rem 1.8rem;border-radius:3px;font-weight:600;font-size:.9rem;text-decoration:none}
  .btn-primary:hover{background:var(--gold2)}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">Novo Jeito Academy</span>
  <h1>Essa oportunidade <em>não está disponível</em> no momento.</h1>
  <p>As candidaturas para bolsa não estão abertas agora. Se quiser conhecer o curso e as formas de matrícula, visite a página principal.</p>
  <a href="/" class="btn-primary">Voltar ao site</a>
</div>
</body>
</html>
